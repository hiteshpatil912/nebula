name: Build and Deploy to Netlify

on:
  push: {}

jobs:
  build:
    name: Build (all branches)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        run: npm run build

      - name: Upload `dist` artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    name: Deploy to Netlify (main only)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository (for metadata)
        uses: actions/checkout@v4

      - name: Download `dist` artifact
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Deploy to Netlify (official GitHub Action)
        uses: netlify/actions/cli@v1
        with:
          args: deploy --dir=dist --prod --site=${{ secrets.NETLIFY_SITE_ID }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

# Notes:
# - Create two repository secrets: NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID
# - NETLIFY_AUTH_TOKEN: a Personal Access Token from Netlify (User settings → Applications → Personal access tokens)
# - NETLIFY_SITE_ID: available in your Netlify Site settings → Site information (Site ID)
# - The `deploy` job runs only when pushing to the `main` branch.
