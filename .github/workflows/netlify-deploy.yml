name: Build and Deploy to Netlify

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        run: npm run build

      - name: Deploy to Netlify (via Netlify CLI)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@latest deploy --dir=dist --site=${NETLIFY_SITE_ID} --auth=${NETLIFY_AUTH_TOKEN} --prod

# Notes:
# - Create two repository secrets: NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID
# - NETLIFY_AUTH_TOKEN: a Personal Access Token from Netlify (User settings → Applications → Personal access tokens)
# - NETLIFY_SITE_ID: available in your Netlify Site settings → Site information (Site ID)
# - The workflow triggers on pushes to `main`. Adjust branch name if needed.
